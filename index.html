<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flashlight">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Flashlight</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  background: #1a1c2a;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  overflow: hidden;
  user-select: none;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}

.vent {
  width: 100%;
  height: 52px;
  background: linear-gradient(180deg, #111320 0%, #1a1c2a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-shrink: 0;
}
.vent-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #0d0f1a;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.04);
}
.vent-line {
  width: 2px; height: 28px;
  border-radius: 1px;
  background: #0d0f1a;
}
.vent-indicator {
  width: 3px; height: 18px;
  border-radius: 2px;
  transition: background 0.4s, box-shadow 0.4s;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  width: 100%;
}

.ring-container {
  position: relative;
  width: 280px; height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.glow-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.06);
  transition: border-color 0.4s ease, box-shadow 0.4s ease;
}
.glow-ring.dim {
  border-color: #ffaa00;
  box-shadow: 0 0 24px 4px rgba(255,170,0,0.4), inset 0 0 24px 4px rgba(255,170,0,0.08);
}
.glow-ring.bright {
  border-color: #00e5ff;
  box-shadow: 0 0 24px 4px rgba(0,229,255,0.4), inset 0 0 24px 4px rgba(0,229,255,0.08);
}

.knob-wrap {
  position: relative;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: linear-gradient(145deg, #252840, #12141f);
  box-shadow:
    8px 8px 20px rgba(0,0,0,0.7),
    -4px -4px 12px rgba(255,255,255,0.04),
    inset 2px 2px 6px rgba(255,255,255,0.05),
    inset -4px -4px 12px rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.12s ease;
  z-index: 2;
}
.knob-wrap:active { transform: scale(0.96); }

.knob-inner {
  width: 160px; height: 160px;
  border-radius: 50%;
  background: linear-gradient(145deg, #1e2035, #10121c);
  box-shadow: inset 4px 4px 12px rgba(0,0,0,0.7), inset -2px -2px 8px rgba(255,255,255,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}
.knob-inner.dim-glow {
  box-shadow: inset 4px 4px 12px rgba(0,0,0,0.5), 0 0 30px rgba(255,170,0,0.2);
}
.knob-inner.bright-glow {
  box-shadow: inset 4px 4px 12px rgba(0,0,0,0.5), 0 0 30px rgba(0,229,255,0.2);
}

.torch-icon {
  width: 72px; height: 72px;
  transition: filter 0.3s ease, color 0.3s ease;
  color: rgba(255,255,255,0.2);
}
.torch-icon.dim { color: #ffaa00; filter: drop-shadow(0 0 8px rgba(255,170,0,0.7)); }
.torch-icon.bright { color: #00e5ff; filter: drop-shadow(0 0 8px rgba(0,229,255,0.7)); }

/* background glow for full brightness */
.screen-glow {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(0,229,255,0.07) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
  z-index: 0;
}
.screen-glow.on { opacity: 1; }

.status-label {
  margin-top: 36px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  transition: color 0.3s ease;
  z-index: 1;
}
.status-label.dim { color: #ffaa00; }
.status-label.bright { color: #00e5ff; }

.bottom-bar {
  width: 100%;
  padding: 18px 32px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 1;
}
.bottom-title { text-align: center; flex: 1; }
.bottom-title h1 {
  color: rgba(255,255,255,0.9);
  font-size: 15px; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
}
.bottom-title p {
  color: rgba(255,255,255,0.3);
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 2px;
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: rgba(255,255,255,0.35);
}
.icon-btn svg { width: 18px; height: 18px; }

/* ── Sheet Overlay ── */
.sheet-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0);
  z-index: 10; display: none;
  transition: background 0.35s ease;
}
.sheet-overlay.visible { display: block; background: rgba(0,0,0,0.6); }

/* ── Choose Sheet (2 options) ── */
.choose-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #1c1c1e;
  border-radius: 20px 20px 0 0;
  z-index: 11;
  transform: translateY(100%);
  transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
.choose-sheet.up { transform: translateY(0); }

.ap-handle {
  width: 36px; height: 5px;
  background: rgba(255,255,255,0.25);
  border-radius: 3px;
  margin: 10px auto 0;
}

.choose-title {
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  text-align: center;
  padding: 16px 20px 12px;
  border-bottom: 0.5px solid rgba(255,255,255,0.1);
  letter-spacing: 0.01em;
}

.option-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  border-bottom: 0.5px solid rgba(255,255,255,0.07);
  cursor: pointer;
  transition: background 0.15s;
  -webkit-appearance: none;
  background: none;
  border-left: none; border-right: none; border-top: none;
  width: 100%;
  text-align: left;
}
.option-btn:active { background: rgba(255,255,255,0.05); }
.option-btn:last-of-type { border-bottom: none; }

.option-left { display: flex; flex-direction: column; gap: 3px; }
.option-name { color: #fff; font-size: 17px; font-weight: 500; }
.option-sub { color: rgba(255,255,255,0.4); font-size: 13px; }
.option-price {
  font-size: 20px; font-weight: 700;
  color: #fff; letter-spacing: -0.02em;
}
.option-price.amber { color: #ffaa00; }
.option-price.cyan { color: #00e5ff; }

.choose-cancel {
  display: block; text-align: center;
  color: #0a84ff; font-size: 16px;
  padding: 16px 20px 6px;
  cursor: pointer; background: none; border: none; width: 100%;
}

/* ── Apple Pay Sheet ── */
.ap-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #1c1c1e;
  border-radius: 20px 20px 0 0;
  z-index: 12;
  transform: translateY(100%);
  transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
.ap-sheet.up { transform: translateY(0); }

.ap-header {
  padding: 16px 20px 12px;
  display: flex; align-items: center; gap: 14px;
  border-bottom: 0.5px solid rgba(255,255,255,0.1);
}
.ap-merchant-icon {
  width: 52px; height: 52px; border-radius: 14px;
  background: linear-gradient(145deg, #252840, #111320);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ap-merchant-info { flex: 1; }
.ap-merchant-name { color: #fff; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.ap-merchant-sub { color: rgba(255,255,255,0.45); font-size: 13px; margin-top: 2px; }
.ap-amount { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }

.ap-card-section { padding: 14px 20px 0; }
.ap-card {
  background: linear-gradient(135deg, #1a3a5c 0%, #0e2540 50%, #1a2d47 100%);
  border-radius: 14px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  position: relative; overflow: hidden;
}
.ap-card::before {
  content: ''; position: absolute;
  top: -30%; left: -10%; width: 60%; height: 160%;
  background: rgba(255,255,255,0.04); transform: rotate(-15deg);
}
.ap-card-chip {
  width: 36px; height: 28px; border-radius: 5px;
  background: linear-gradient(135deg, #d4a84b, #f5d17a, #c8922a);
  flex-shrink: 0;
}
.ap-card-info { flex: 1; }
.ap-card-bank { color: rgba(255,255,255,0.9); font-size: 14px; font-weight: 600; }
.ap-card-num { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 2px; letter-spacing: 0.08em; }
.ap-card-network { display: flex; flex-shrink: 0; }
.ap-circle { width: 26px; height: 26px; border-radius: 50%; }
.ap-circle-left { background: #eb001b; margin-right: -10px; }
.ap-circle-right { background: #f79e1b; opacity: 0.95; }
.ap-chevron { color: rgba(255,255,255,0.3); font-size: 18px; margin-left: 6px; }

.ap-details { padding: 10px 20px 0; }
.ap-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 0.5px solid rgba(255,255,255,0.07);
}
.ap-row:last-child { border-bottom: none; }
.ap-row-label { color: rgba(255,255,255,0.5); font-size: 14px; }
.ap-row-value { color: rgba(255,255,255,0.9); font-size: 14px; font-weight: 500; }

.ap-pay-btn {
  margin: 14px 20px 8px;
  height: 54px; border-radius: 14px; border: none;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-appearance: none;
  position: relative; overflow: hidden;
  width: calc(100% - 40px);
  transition: opacity 0.15s;
}
.ap-pay-btn:active { opacity: 0.75; }
.ap-logo { display: flex; align-items: center; gap: 4px; }
.ap-logo-apple { color: #fff; font-size: 20px; line-height: 1; margin-top: -3px; }
.ap-logo-pay { color: #fff; font-size: 18px; font-weight: 600; }
.ap-faceid {
  width: 22px; height: 22px;
  border: 2px solid rgba(255,255,255,0.8);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  margin-left: 8px;
}
.scan-line {
  display: none; position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: rgba(255,255,255,0.5);
  animation: scanDown 0.7s ease-in-out forwards;
}
@keyframes scanDown {
  0% { top: 0; opacity: 1; }
  100% { top: 100%; opacity: 0; }
}
.ap-pay-btn.scanning .scan-line { display: block; }

.ap-cancel {
  display: block; text-align: center;
  color: #0a84ff; font-size: 16px;
  padding: 12px 20px 6px;
  cursor: pointer; background: none; border: none; width: 100%;
}
</style>
</head>
<body>

<div class="screen-glow" id="screenGlow"></div>

<div class="vent">
  <div class="vent-line"></div><div class="vent-line"></div>
  <div class="vent-indicator" id="ventIndicator" style="background:#333"></div>
  <div class="vent-line"></div><div class="vent-line"></div>
  <div class="vent-dot"></div><div class="vent-dot"></div>
  <div class="vent-dot"></div><div class="vent-dot"></div>
  <div class="vent-dot"></div><div class="vent-dot"></div>
  <div class="vent-dot"></div><div class="vent-dot"></div>
  <div class="vent-dot"></div>
</div>

<div class="main">
  <div class="ring-container">
    <div class="glow-ring" id="glowRing"></div>
    <div class="knob-wrap" id="knobWrap" onclick="handleFlash()">
      <div class="knob-inner" id="knobInner">
        <svg class="torch-icon" id="torchIcon" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="28" y="34" width="16" height="24" rx="3" fill="currentColor"/>
          <rect x="22" y="20" width="28" height="16" rx="4" fill="currentColor" opacity="0.85"/>
          <circle cx="36" cy="28" r="7" fill="currentColor" opacity="0.5"/>
          <circle cx="36" cy="28" r="4" fill="currentColor"/>
          <line x1="29" y1="40" x2="43" y2="40" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="29" y1="44" x2="43" y2="44" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="29" y1="48" x2="43" y2="48" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" stroke-linecap="round"/>
          <g id="beamRays" style="opacity:0; transition: opacity 0.3s">
            <line x1="36" y1="14" x2="36" y2="6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="22" y1="18" x2="16" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="50" y1="18" x2="56" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="17" y1="28" x2="9" y2="28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="55" y1="28" x2="63" y2="28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
  <div class="status-label" id="statusLabel">OFF</div>
</div>

<div class="bottom-bar">
  <div class="icon-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </div>
  <div class="bottom-title">
    <h1>Flash Light</h1>
    <p>App UI</p>
  </div>
  <div class="icon-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
  </div>
</div>

<!-- Overlay -->
<div class="sheet-overlay" id="overlay"></div>

<!-- Choose Sheet -->
<div class="choose-sheet" id="chooseSheet">
  <div class="ap-handle"></div>
  <div class="choose-title">Select Flashlight Mode</div>

  <button class="option-btn" onclick="selectOption('dim')">
    <div class="option-left">
      <span class="option-name">30% Brightness</span>
      <span class="option-sub">Basic mode · One-time</span>
    </div>
    <span class="option-price amber">$100</span>
  </button>

  <button class="option-btn" onclick="selectOption('bright')">
    <div class="option-left">
      <span class="option-name">100% Brightness</span>
      <span class="option-sub">Pro mode · One-time</span>
    </div>
    <span class="option-price cyan">$300</span>
  </button>

  <button class="choose-cancel" onclick="dismissAll()">Cancel</button>
</div>

<!-- Apple Pay Sheet -->
<div class="ap-sheet" id="apSheet">
  <div class="ap-handle"></div>
  <div class="ap-header">
    <div class="ap-merchant-icon">
      <svg width="28" height="28" viewBox="0 0 72 72" fill="none">
        <rect x="28" y="34" width="16" height="24" rx="3" fill="#00e5ff"/>
        <rect x="22" y="20" width="28" height="16" rx="4" fill="#00e5ff" opacity="0.85"/>
        <circle cx="36" cy="28" r="4" fill="#00e5ff"/>
        <line x1="36" y1="14" x2="36" y2="8" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="22" y1="18" x2="17" y2="13" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="50" y1="18" x2="55" y2="13" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="ap-merchant-info">
      <div class="ap-merchant-name" id="apActionLabel">Turn On Flashlight</div>
      <div class="ap-merchant-sub">FlashlightPro™ · In-App Purchase</div>
    </div>
    <div class="ap-amount" id="apAmount">$100</div>
  </div>

  <div class="ap-card-section">
    <div class="ap-card">
      <div class="ap-card-chip"></div>
      <div class="ap-card-info">
        <div class="ap-card-bank">Commonwealth Bank</div>
        <div class="ap-card-num">Visa •••• 4812</div>
      </div>
      <div class="ap-card-network">
        <div class="ap-circle ap-circle-left"></div>
        <div class="ap-circle ap-circle-right"></div>
      </div>
      <span class="ap-chevron">›</span>
    </div>
  </div>

  <div class="ap-details">
    <div class="ap-row">
      <span class="ap-row-label">Subtotal</span>
      <span class="ap-row-value" id="apSubtotal">$100</span>
    </div>
    <div class="ap-row">
      <span class="ap-row-label">Tax</span>
      <span class="ap-row-value">Included</span>
    </div>
    <div class="ap-row">
      <span class="ap-row-label" style="font-weight:600;color:rgba(255,255,255,0.85)">Total</span>
      <span class="ap-row-value" id="apTotal" style="font-size:16px;font-weight:700">$100</span>
    </div>
  </div>

  <button class="ap-pay-btn" id="payBtn" onclick="handlePay()">
    <div class="scan-line"></div>
    <div class="ap-logo">
      <span class="ap-logo-apple"></span>
      <span class="ap-logo-pay">Pay</span>
    </div>
    <div class="ap-faceid">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <rect x="1" y="1" width="10" height="10" rx="2" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
        <line x1="6" y1="4" x2="6" y2="8" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="4" y1="6" x2="8" y2="6" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
  </button>
  <button class="ap-cancel" onclick="dismissApPay()">Cancel</button>
</div>

<script>
  // state: 'off' | 'dim' | 'bright'
  let state = 'off';
  let pendingOption = null;

  const glowRing = document.getElementById('glowRing');
  const knobInner = document.getElementById('knobInner');
  const torchIcon = document.getElementById('torchIcon');
  const beamRays = document.getElementById('beamRays');
  const statusLabel = document.getElementById('statusLabel');
  const ventIndicator = document.getElementById('ventIndicator');
  const screenGlow = document.getElementById('screenGlow');
  const overlay = document.getElementById('overlay');
  const chooseSheet = document.getElementById('chooseSheet');
  const apSheet = document.getElementById('apSheet');
  const apActionLabel = document.getElementById('apActionLabel');
  const apAmount = document.getElementById('apAmount');
  const apSubtotal = document.getElementById('apSubtotal');
  const apTotal = document.getElementById('apTotal');
  const payBtn = document.getElementById('payBtn');

  function applyState(s) {
    state = s;
    if (s === 'off') {
      glowRing.className = 'glow-ring';
      knobInner.className = 'knob-inner';
      torchIcon.className = 'torch-icon';
      beamRays.style.opacity = '0';
      statusLabel.textContent = 'OFF';
      statusLabel.className = 'status-label';
      ventIndicator.style.background = '#333';
      ventIndicator.style.boxShadow = 'none';
      screenGlow.className = 'screen-glow';
    } else if (s === 'dim') {
      glowRing.className = 'glow-ring dim';
      knobInner.className = 'knob-inner dim-glow';
      torchIcon.className = 'torch-icon dim';
      beamRays.style.opacity = '0.5';
      statusLabel.textContent = '30%';
      statusLabel.className = 'status-label dim';
      ventIndicator.style.background = '#ffaa00';
      ventIndicator.style.boxShadow = '0 0 6px #ffaa00';
      screenGlow.className = 'screen-glow';
    } else if (s === 'bright') {
      glowRing.className = 'glow-ring bright';
      knobInner.className = 'knob-inner bright-glow';
      torchIcon.className = 'torch-icon bright';
      beamRays.style.opacity = '1';
      statusLabel.textContent = '100%';
      statusLabel.className = 'status-label bright';
      ventIndicator.style.background = '#00e5ff';
      ventIndicator.style.boxShadow = '0 0 6px #00e5ff';
      screenGlow.className = 'screen-glow on';
    }
  }

  function handleFlash() {
    if (state === 'off') {
      // show choose sheet
      showOverlay();
      requestAnimationFrame(() => { chooseSheet.classList.add('up'); });
    } else {
      // turn off — $129.99
      apActionLabel.textContent = 'Turn Off Flashlight';
      apAmount.textContent = '$129.99';
      apSubtotal.textContent = '$129.99';
      apTotal.textContent = '$129.99';
      pendingOption = 'off';
      showApPay();
    }
  }

  function selectOption(opt) {
    pendingOption = opt;
    chooseSheet.classList.remove('up');
    setTimeout(() => {
      if (opt === 'dim') {
        apActionLabel.textContent = 'Turn On — 30% Brightness';
        apAmount.textContent = '$100';
        apSubtotal.textContent = '$100';
        apTotal.textContent = '$100';
      } else {
        apActionLabel.textContent = 'Turn On — 100% Brightness';
        apAmount.textContent = '$300';
        apSubtotal.textContent = '$300';
        apTotal.textContent = '$300';
      }
      showApPay();
    }, 300);
  }

  function showOverlay() {
    overlay.style.display = 'block';
    requestAnimationFrame(() => { overlay.classList.add('visible'); });
  }

  function showApPay() {
    if (!overlay.classList.contains('visible')) showOverlay();
    requestAnimationFrame(() => { apSheet.classList.add('up'); });
  }

  function dismissAll() {
    chooseSheet.classList.remove('up');
    apSheet.classList.remove('up');
    setTimeout(() => {
      overlay.classList.remove('visible');
      setTimeout(() => { overlay.style.display = 'none'; }, 350);
    }, 100);
  }

  function dismissApPay() {
    apSheet.classList.remove('up');
    // if coming from choose sheet path, go back to it
    if (pendingOption === 'dim' || pendingOption === 'bright') {
      setTimeout(() => { chooseSheet.classList.add('up'); }, 200);
    } else {
      setTimeout(() => {
        overlay.classList.remove('visible');
        setTimeout(() => { overlay.style.display = 'none'; }, 350);
      }, 100);
    }
  }

  overlay.addEventListener('click', dismissAll);

  function playPaymentSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function tone(freq, startTime, duration, gainVal, type = 'sine') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
      gain.gain.setValueAtTime(0, ctx.currentTime + startTime);
      gain.gain.linearRampToValueAtTime(gainVal, ctx.currentTime + startTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
      osc.start(ctx.currentTime + startTime);
      osc.stop(ctx.currentTime + startTime + duration);
    }
    tone(880,  0.0,  0.12, 0.3);
    tone(1320, 0.08, 0.18, 0.25);
    tone(1760, 0.18, 0.25, 0.35);
    tone(2200, 0.28, 0.4,  0.2);
    tone(440,  0.28, 0.06, 0.15, 'square');
    tone(220,  0.32, 0.08, 0.1,  'square');
  }

  function handlePay() {
    payBtn.classList.add('scanning');
    setTimeout(() => { playPaymentSound(); }, 600);
    setTimeout(() => {
      payBtn.classList.remove('scanning');
      if (pendingOption === 'off') applyState('off');
      else if (pendingOption === 'dim') applyState('dim');
      else if (pendingOption === 'bright') applyState('bright');
      dismissAll();
    }, 850);
  }
</script>
</body>
